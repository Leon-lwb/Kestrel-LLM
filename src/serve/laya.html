<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laya 决策配置 · vLLM-Kestrel</title>
<style>
:root{--bg:#0f1419;--panel:#1a212b;--panel2:#202a36;--bd:#2c3a4a;--tx:#d7e0ea;--tx2:#8ea0b4;--acc:#4da3ff;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#ffb020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "SF Mono",Consolas,"Microsoft YaHei",monospace}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--bd)}
header h1{font-size:16px;margin:0;font-weight:600}
.navlink{color:var(--tx2);font-size:12px;text-decoration:none;border:1px solid var(--bd);border-radius:6px;padding:3px 10px}
.navlink:hover{color:var(--acc);border-color:var(--acc)}
main{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 20px;max-width:1400px;margin:0 auto}
@media(max-width:980px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card.wide{grid-column:1/-1}
.card h2{font-size:13px;margin:0 0 4px;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
label.fld{display:block;margin:6px 0}
label.fld .t{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-bottom:3px}
input[type=text],textarea{width:100%;background:var(--panel2);border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit}
textarea{min-height:220px;resize:vertical}
button{background:var(--panel2);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
button:hover{border-color:var(--acc);color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#08131f}
button.primary:hover{filter:brightness(1.1);color:#08131f}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.msg{padding:8px 10px;border-radius:6px;margin-top:8px;font-size:12px;display:none}
.msg.show{display:block}
.msg.ok{background:#14301f;color:var(--ok);border:1px solid #1f4a30}
.msg.err{background:#33191c;color:var(--bad);border:1px solid #5c2c30}
pre{background:#0a0e13;border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-all;margin:6px 0 0;max-height:420px;overflow:auto}
.small{font-size:11px;color:var(--tx2)}
</style>
</head>
<body>
<header>
  <h1>Laya 决策配置</h1>
  <span style="flex:1"></span>
  <a class="navlink" href="/admin/">← 返回管理页 /admin/</a>
</header>
<main>
  <div class="card wide">
    <h2>配置（保存后重启引擎生效）</h2>
    <label class="fld"><span class="t"><span>Laya 权重包目录（--laya-pack，含 laya_f16.bin + manifest）</span></span>
      <input type="text" id="f_laya_pack" placeholder="/mnt/VQF/laya"></label>
    <div class="row">
      <button class="primary" onclick="saveCfg()">保存配置（重启生效）</button>
      <span class="small" id="cfgPath"></span>
    </div>
    <div class="msg" id="cfgMsg"></div>
  </div>

  <div class="card wide">
    <h2>在线试决策（POST /v1/systemone）</h2>
    <label class="fld"><span class="t"><span>请求 JSON（state + questions）</span></span>
      <textarea id="reqBody"></textarea></label>
    <div class="row">
      <button class="primary" onclick="decide()">发送决策请求</button>
      <button onclick="resetReq()">恢复示例</button>
    </div>
    <pre id="resp">（尚未发送）</pre>
    <div class="msg" id="decMsg"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
function showMsg(el, text, ok){ el.textContent = text; el.className = "msg show " + (ok ? "ok" : "err"); }
const TEMPLATE = {
  state: "Hi, we were billed twice for March. Please refund the duplicate today or we will cancel our plan.",
  questions: {
    department: {type:"choice", instructions:"Which department should handle this?",
                 criteria:{billing:"invoices, payments, refunds", technical:"bugs, outages, system errors", other:"everything else"}},
    urgency: {type:"score", instructions:"How urgent is this?", criteria:["not urgent","soon","blocking"]},
    churn_risk: {type:"noul", instructions:"Does the user threaten to cancel or leave?"}
  }
};
function resetReq(){ $("reqBody").value = JSON.stringify(TEMPLATE, null, 2); }

async function loadCfg(){
  try{
    const r = await fetch("/admin/api/config"); const j = await r.json();
    const c = j.config || {};
    $("f_laya_pack").value = c.laya_pack || "";
    $("cfgPath").textContent = j.config_path ? ("配置文件: " + j.config_path) : "";
  }catch(e){ showMsg($("cfgMsg"), "读取配置失败: " + e, false); }
}
async function saveCfg(){
  const body = { laya_pack: $("f_laya_pack").value.trim() };
  try{
    const r = await fetch("/admin/api/config/patch", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
    const j = await r.json();
    showMsg($("cfgMsg"), j.error ? ("失败: " + j.error) : ("已保存到 " + j.path + "（重启引擎生效）"), !j.error);
    loadCfg();
  }catch(e){ showMsg($("cfgMsg"), "请求失败: " + e, false); }
}
async function decide(){
  let payload;
  try { payload = JSON.parse($("reqBody").value); }
  catch(e){ showMsg($("decMsg"), "请求 JSON 解析失败: " + e, false); return; }
  $("resp").textContent = "…";
  try{
    const r = await fetch("/v1/systemone", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)});
    const t = await r.text();
    let out = t;
    try { out = JSON.stringify(JSON.parse(t), null, 2); } catch(e){}
    $("resp").textContent = out;
    showMsg($("decMsg"), r.ok ? "决策完成" : ("HTTP " + r.status), r.ok);
  }catch(e){ $("resp").textContent = ""; showMsg($("decMsg"), "请求失败: " + e, false); }
}

resetReq();
loadCfg();
</script>
</body>
</html>
