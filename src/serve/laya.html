<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laya 决策配置 · vLLM-Kestrel</title>
<style>
/* ============ 设计令牌（暗色控制台统一规范）============ */
:root{
  --bg:#0f1419;--panel:#1a212b;--panel2:#202a36;--panel3:#283442;--bd:#2c3a4a;--bd-hi:#3e5468;
  --tx:#d7e0ea;--tx2:#8ea0b4;--tx3:#63758a;--acc:#4da3ff;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#ffb020;
  --acc-soft:rgba(77,163,255,.13);
  --focus:0 0 0 3px rgba(77,163,255,.22);
  --tr:.16s ease;
  --m-check:url("data:image/svg+xml,%3Csvg xmlns='h%74tp://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20 6 9 17l-5-5'/%3E%3C/svg%3E");
  --m-alert:url("data:image/svg+xml,%3Csvg xmlns='h%74tp://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3'/%3E%3Cpath d='M12 9v4'/%3E%3Cpath d='M12 17h.01'/%3E%3C/svg%3E");
  /* Lucide 图标（内联 data-URI mask，离线可用，不受 JS textContent 重写影响） */
  --i-zap:url("data:image/svg+xml,%3Csvg xmlns='h%74tp://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 2 3 14h9l-1 8 10-12h-9l1-8z'/%3E%3C/svg%3E");
  --i-back:url("data:image/svg+xml,%3Csvg xmlns='h%74tp://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m12 19-7-7 7-7'/%3E%3Cpath d='M19 12H5'/%3E%3C/svg%3E");
  --i-save:url("data:image/svg+xml,%3Csvg xmlns='h%74tp://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z'/%3E%3Cpath d='M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7'/%3E%3Cpath d='M7 3v4a1 1 0 0 0 1 1h7'/%3E%3C/svg%3E");
  --i-send:url("data:image/svg+xml,%3Csvg xmlns='h%74tp://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m22 2-7 20-4-9-9-4Z'/%3E%3Cpath d='M22 2 11 13'/%3E%3C/svg%3E");
  --i-rotate:url("data:image/svg+xml,%3Csvg xmlns='h%74tp://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8'/%3E%3Cpath d='M21 3v5h-5'/%3E%3C/svg%3E");
  --i-sliders:url("data:image/svg+xml,%3Csvg xmlns='h%74tp://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 4h-7'/%3E%3Cpath d='M10 4H3'/%3E%3Cpath d='M21 12h-9'/%3E%3Cpath d='M8 12H3'/%3E%3Cpath d='M21 20h-5'/%3E%3Cpath d='M12 20H3'/%3E%3Cpath d='M14 2v2'/%3E%3Cpath d='M14 10v2'/%3E%3Cpath d='M8 10v2'/%3E%3Cpath d='M16 18v2'/%3E%3Cpath d='M16 4v2'/%3E%3C/svg%3E");
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#2c3a4a transparent}
::selection{background:rgba(77,163,255,.32)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c3a4a;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3e5468}
::-webkit-scrollbar-track{background:transparent}
body{margin:0;color:var(--tx);
  background:
    radial-gradient(1100px 480px at 85% -10%,rgba(77,163,255,.06),transparent 60%),
    radial-gradient(900px 420px at -10% 110%,rgba(62,207,142,.04),transparent 60%),
    var(--bg);
  font:14px/1.6 ui-monospace,"SF Mono","Cascadia Code",Consolas,"Microsoft YaHei",monospace;
  -webkit-font-smoothing:antialiased}
/* ============ 顶栏 ============ */
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:13px 24px;
  background:rgba(26,33,43,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--bd)}
.brand{display:inline-flex;align-items:center;gap:11px;min-width:0}
.brand .mark{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#e8f3ff;
  background:linear-gradient(135deg,#2e7fe0,#1b4d8f);border:1px solid rgba(77,163,255,.5);
  box-shadow:0 2px 12px rgba(46,127,224,.35)}
.brand .mark::before{content:"";width:17px;height:17px;background-color:currentColor;
  -webkit-mask:var(--i-zap) center/contain no-repeat;mask:var(--i-zap) center/contain no-repeat}
.brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{display:block;font-size:10.5px;color:var(--tx2);letter-spacing:.6px;margin-top:1px}
.navlink{display:inline-flex;align-items:center;gap:6px;color:var(--tx2);font-size:12px;text-decoration:none;
  border:1px solid var(--bd);border-radius:8px;padding:5px 12px;transition:color var(--tr),border-color var(--tr),background var(--tr)}
.navlink:hover{color:var(--acc);border-color:var(--acc);background:var(--acc-soft)}
/* ============ 图标（Lucide mask）============ */
[class^="ic-"]::before,[class*=" ic-"]::before{
  content:"";display:inline-block;width:14px;height:14px;flex:none;
  background-color:currentColor;
  -webkit-mask:var(--icon) center/contain no-repeat;mask:var(--icon) center/contain no-repeat}
.ic-zap{--icon:var(--i-zap)}
.ic-back{--icon:var(--i-back)}
.ic-save{--icon:var(--i-save)}
.ic-send{--icon:var(--i-send)}
.ic-rotate{--icon:var(--i-rotate)}
.ic-sliders{--icon:var(--i-sliders)}
/* ============ 布局与卡片 ============ */
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px 24px 32px;max-width:1400px;margin:0 auto}
@media(max-width:980px){main{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,rgba(255,255,255,.015),rgba(255,255,255,0) 46px),var(--panel);
  border:1px solid var(--bd);border-radius:13px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 12px 32px -26px rgba(0,0,0,.95);min-width:0;transition:border-color var(--tr)}
.card:hover{border-color:#35485e}
.card.wide{grid-column:1/-1}
.card h2{display:flex;align-items:center;gap:9px;font-size:12.5px;margin:0 0 10px;padding-bottom:10px;
  border-bottom:1px solid rgba(44,58,74,.6);color:#c3d1e1;font-weight:700;text-transform:uppercase;letter-spacing:.8px;flex-wrap:wrap}
/* ============ 表单 ============ */
label.fld{display:block;margin:10px 0}
label.fld .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:11.5px;color:var(--tx2);margin-bottom:5px;letter-spacing:.2px}
input[type=text],textarea{width:100%;background:#141b24;border:1px solid var(--bd);color:var(--tx);border-radius:8px;
  padding:8px 11px;font-size:13px;font-family:inherit;transition:border-color var(--tr),box-shadow var(--tr)}
input[type=text]:hover,textarea:hover{border-color:var(--bd-hi)}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:var(--focus)}
::placeholder{color:#5d7086}
textarea{min-height:220px;resize:vertical;line-height:1.6}
/* ============ 按钮 ============ */
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);color:var(--tx);
  border:1px solid var(--bd);border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;
  white-space:nowrap;transition:color var(--tr),border-color var(--tr),background-color var(--tr),box-shadow var(--tr),transform var(--tr)}
button:hover{border-color:var(--bd-hi);background:var(--panel3);color:#cfe4ff}
button:active{transform:translateY(1px)}
button:focus-visible{outline:none;box-shadow:var(--focus)}
button.primary{background:linear-gradient(180deg,#57a7ff,#3d8bee);border-color:#3d8bee;color:#07131f;font-weight:600}
button.primary:hover{filter:brightness(1.09);color:#07131f;border-color:#5aa0f5}
/* ============ 行 / 消息 / 输出 ============ */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(44,58,74,.55)}
.msg{display:none;align-items:flex-start;gap:9px;padding:9px 13px;border-radius:8px;margin-top:10px;font-size:12px;line-height:1.55}
.msg.show{display:flex}
.msg.ok{background:#142c21;color:var(--ok);border:1px solid #1f4a30}
.msg.err{background:#33191c;color:var(--bad);border:1px solid #5c2c30}
.msg.show::before{content:"";flex:none;width:14px;height:14px;margin-top:2px;background-color:currentColor;
  -webkit-mask:var(--m-alert) center/contain no-repeat;mask:var(--m-alert) center/contain no-repeat}
.msg.ok.show::before{-webkit-mask-image:var(--m-check);mask-image:var(--m-check)}
pre{background:#0a0e13;border:1px solid var(--bd);border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.65;
  white-space:pre-wrap;word-break:break-all;margin:8px 0 0;max-height:420px;overflow:auto}
.small{font-size:11.5px;color:var(--tx2)}
/* K-ADMIN-002：组件运行态状态条 */
.cstat{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px}
.cstat .dot{width:9px;height:9px;border-radius:50%;flex:none;background:#63758a;box-shadow:0 0 0 3px rgba(99,117,138,.18)}
.cstat.on .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.18)}
.cstat.half .dot{background:var(--warn);box-shadow:0 0 0 3px rgba(255,176,32,.18)}
.cstat.err .dot{background:var(--bad);box-shadow:0 0 0 3px rgba(255,107,107,.18)}
.cstat .txt{color:var(--tx2)}
.cstat.warnbox{display:block;background:#33290f;border:1px solid #5c4a1f;color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="mark"></span>
    <div><h1>Laya 决策配置</h1><span class="sub">vLLM-KESTREL · EDGE CONSOLE</span></div>
  </div>
  <span style="flex:1"></span>
  <a class="navlink ic-back" href="/admin/">返回管理页 /admin/</a>
</header>
<main>
  <div class="card wide">
    <h2>模型运行状态<span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--tx2)">（运行时只读 · 需重启生效）</span></h2>
    <div class="cstat" id="cstat"><span class="dot"></span><span class="txt" id="cstatTxt">读取中…</span></div>
    <div class="cstat warnbox" id="cstatWarn" style="display:none"></div>
    <div class="row">
      <button class="primary" id="cbtn" onclick="collabToggle()">…</button>
      <span class="small">启用/停用只改配置，需重启引擎生效（停用后该端点显式 404）</span>
    </div>
    <div class="msg" id="cstatMsg"></div>
  </div>
  <div class="card wide">
    <h2 class="ic-sliders">配置<span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--tx2)">（保存后重启引擎生效）</span></h2>
    <label class="fld"><span class="t"><span>Laya 权重包目录（--laya-pack，含 laya_f16.bin + manifest）</span></span>
      <input type="text" id="f_laya_pack" placeholder="/mnt/VQF/laya"></label>
    <div class="row">
      <button class="primary ic-save" onclick="saveCfg()">保存配置（重启生效）</button>
      <span class="small" id="cfgPath"></span>
    </div>
    <div class="msg" id="cfgMsg"></div>
  </div>

  <div class="card wide">
    <h2 class="ic-zap">在线试决策<span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--tx2)">（POST /v1/systemone）</span></h2>
    <label class="fld"><span class="t"><span>请求 JSON（state + questions）</span></span>
      <textarea id="reqBody"></textarea></label>
    <div class="row">
      <button class="primary ic-send" onclick="decide()">发送决策请求</button>
      <button class="ic-rotate" onclick="resetReq()">恢复示例</button>
    </div>
    <pre id="resp">（尚未发送）</pre>
    <div class="msg" id="decMsg"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
function showMsg(el, text, ok){ el.textContent = text; el.className = "msg show " + (ok ? "ok" : "err"); }
const TEMPLATE = {
  state: "Hi, we were billed twice for March. Please refund the duplicate today or we will cancel our plan.",
  questions: {
    department: {type:"choice", instructions:"Which department should handle this?",
                 criteria:{billing:"invoices, payments, refunds", technical:"bugs, outages, system errors", other:"everything else"}},
    urgency: {type:"score", instructions:"How urgent is this?", criteria:["not urgent","soon","blocking"]},
    churn_risk: {type:"noul", instructions:"Does the user threaten to cancel or leave?"}
  }
};
function resetReq(){ $("reqBody").value = JSON.stringify(TEMPLATE, null, 2); }

async function loadCfg(){
  try{
    const r = await fetch("/admin/api/config"); const j = await r.json();
    const c = j.config || {};
    $("f_laya_pack").value = c.laya_pack || "";
    $("cfgPath").textContent = j.config_path ? ("配置文件: " + j.config_path) : "";
  }catch(e){ showMsg($("cfgMsg"), "读取配置失败: " + e, false); }
}
async function saveCfg(){
  const body = { laya_pack: $("f_laya_pack").value.trim() };
  try{
    const r = await fetch("/admin/api/config/patch", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
    const j = await r.json();
    showMsg($("cfgMsg"), j.error ? ("失败: " + j.error) : ("已保存到 " + j.path + "（重启引擎生效）"), !j.error);
    loadCfg();
  }catch(e){ showMsg($("cfgMsg"), "请求失败: " + e, false); }
}
async function decide(){
  let payload;
  try { payload = JSON.parse($("reqBody").value); }
  catch(e){ showMsg($("decMsg"), "请求 JSON 解析失败: " + e, false); return; }
  $("resp").textContent = "…";
  try{
    const r = await fetch("/v1/systemone", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)});
    const t = await r.text();
    let out = t;
    try { out = JSON.stringify(JSON.parse(t), null, 2); } catch(e){}
    $("resp").textContent = out;
    showMsg($("decMsg"), r.ok ? "决策完成" : ("HTTP " + r.status), r.ok);
  }catch(e){ $("resp").textContent = ""; showMsg($("decMsg"), "请求失败: " + e, false); }
}

resetReq();
loadCfg();

/* ---------- K-ADMIN-002：组件运行态 + 加载/卸载（启用/停用） ---------- */
const COLLAB_KEY = "laya_pack";    /* 配置键 */
const COLLAB_NAME = "laya";  /* collab 字段名 */
async function collabRefresh(){
  try{
    const r = await fetch("/admin/api/status"); const j = await r.json();
    const c = (j.collab || {})[COLLAB_NAME];
    const box = $("cstat"), txt = $("cstatTxt"), warn = $("cstatWarn"), btn = $("cbtn");
    if (!c){ box.className = "cstat"; txt.textContent = "该引擎未上报组件状态（需支持 collab 字段的版本）"; return; }
    if (c.failed){ box.className = "cstat err"; txt.textContent = "状态：已配置，但加载失败"; }
    else if (c.loaded){ box.className = "cstat on"; txt.textContent = "状态：已加载（运行态就绪）"; }
    else if (c.enabled){ box.className = "cstat half"; txt.textContent = "状态：已启用 · 未加载（首次请求时懒加载）"; }
    else { box.className = "cstat"; txt.textContent = "状态：未启用"; }
    if (COLLAB_NAME === "embed" && c.mode === "fallback_main"){
      warn.style.display = ""; warn.className = "cstat warnbox";
      warn.textContent = "未配置专用向量模型：RAG 将复用主模型出向量，检索质量下降（这是回退，不是停用）。";
    } else { warn.style.display = "none"; }
    btn.textContent = c.enabled ? (COLLAB_NAME === "embed" ? "切回复用主模型" : "卸载（停用）") : "加载（启用）";
  }catch(e){ $("cstatTxt").textContent = "状态读取失败: " + e; }
}
async function collabToggle(){
  let c = {};
  try{ const r = await fetch("/admin/api/status"); const j = await r.json(); c = (j.collab || {})[COLLAB_NAME] || {}; }catch(e){}
  if (!c.enabled){
    showMsg($("cstatMsg"), "启用：请在下方「配置」卡片填写路径并保存，然后重启引擎生效。", true);
    return;
  }
  const isEmb = (COLLAB_NAME === "embed");
  const q = isEmb
    ? "切换回\u300c复用主模型\u300d？\n注意：这不是停用——RAG 将改用主模型出向量，检索质量会下降。\n保存后需重启引擎生效。"
    : "卸载（停用）该组件？\n该端点将返回 404（显式报错，不静默降级）。\n保存后需重启引擎生效。";
  if (!confirm(q)) return;
  const body = {}; body[COLLAB_KEY] = "";
  try{
    const r = await fetch("/admin/api/config/patch", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
    const j = await r.json();
    showMsg($("cstatMsg"), j.error ? ("失败: " + j.error) : ("已保存到 " + j.path + "（重启引擎生效）"), !j.error);
    loadCfg(); collabRefresh();
  }catch(e){ showMsg($("cstatMsg"), "请求失败: " + e, false); }
}
collabRefresh();
</script>
</body>
</html>
